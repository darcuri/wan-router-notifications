router:
  host: "192.168.0.1"
  snmp_username: "testuser"
  snmp_auth_key: "testpass"
  snmp_auth_protocol: "MD5"
  snmp_port: 161

polling:
  normal_interval: 60
  alert_interval: 15
  recovery_threshold: 5

syslog:
  enabled: true
  port: 514

heartbeat:
  remote_url: "http://100.64.0.1:8080/heartbeat"
  interval: 60
